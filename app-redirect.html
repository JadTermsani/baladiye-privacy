<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Baladiye App (iOS & Android)</title>
    <meta http-equiv="refresh" content="0; url=baladiye://">
    <script>
        // Try to open the app immediately
        window.location.href = "baladiye://";
        
        // Fallback: redirect to privacy policy after 1 second if app doesn't open
        setTimeout(function() {
            window.location.href = "index.html";
        }, 1000);
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #3f5e4a;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 16px;
        }
        p {
            opacity: 0.9;
            font-size: 1rem;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Opening Baladiye...</h1>
        <p>Works on both iOS and Android</p>
        <p style="margin-top: 12px; font-size: 0.9rem;">If the app doesn't open automatically, <a href="baladiye://" style="color: white; text-decoration: underline;">click here</a></p>
    </div>
</body>
</html>
